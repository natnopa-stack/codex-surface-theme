name: Align v1.12.3 after cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/align-v1.12.3-after-cleanup.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for workflow cleanup and align tag
        shell: bash
        run: |
          set -euo pipefail
          workflow_path='.github/workflows/align-v1.12.3-after-cleanup.yml'
          for attempt in $(seq 1 60); do
            git fetch origin main --force
            if ! git cat-file -e "origin/main:${workflow_path}" 2>/dev/null; then
              target_sha=$(git rev-parse origin/main)
              git tag -f v1.12.3 "$target_sha"
              git push origin refs/tags/v1.12.3 --force
              echo "TAG_TARGET=$target_sha"
              exit 0
            fi
            sleep 2
          done
          echo 'Workflow cleanup was not observed in time.' >&2
          exit 1
