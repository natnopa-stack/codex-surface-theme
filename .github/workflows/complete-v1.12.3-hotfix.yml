name: Complete v1.12.3 safe-launcher hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/complete-v1.12.3-hotfix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  complete:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize checkout line endings
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git reset --hard HEAD

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update validation and public documentation
        shell: python
        run: |
          from __future__ import annotations

          import re
          import shutil
          from pathlib import Path

          root = Path('.')

          test_path = root / 'Test-ThemePackage.ps1'
          test_text = test_path.read_text(encoding='utf-8-sig')
          recovery_pattern = re.compile(
              r"Add-Check \(\$launchScript\.Contains\('THEME_RECOVERY_REQUIRED=1'\).*?"
              r'"Apply entry falls back to recovery launcher"\r?\n',
              re.S,
          )
          recovery_checks = '\n'.join([
              "Add-Check ($launchScript.Contains('THEME_RECOVERY_REQUIRED=1') -and $launchScript.Contains('active tasks remain untouched') -and $launchScript.Contains('exit 2')) \"launcher fails closed for running Codex without endpoint\"",
              "Add-Check ((-not $launchScript.Contains('CloseMainWindow()')) -and (-not $launchScript.Contains('Stop-Process')) -and (-not $launchScript.Contains('[switch]$AutoRecover'))) \"launcher never closes or restarts Codex\"",
              "Add-Check ($launchCmd.Contains('Launch-Codex-Themed.ps1\"') -and (-not $launchCmd.Contains('-AutoRecover'))) \"launcher CMD keeps recovery manual\"",
              "Add-Check ($applyCmd.Contains('if not \"%exit_code%\"==\"2\" goto pause_now') -and $applyCmd.Contains('No Codex process was closed or restarted') -and (-not $applyCmd.Contains('Launch-Codex-Themed.ps1'))) \"Apply entry preserves running Codex\"",
              '',
          ])
          test_text, count = recovery_pattern.subn(recovery_checks, test_text, count=1)
          if count != 1:
              raise RuntimeError('Could not replace the automatic-recovery QA block.')
          test_path.write_text(test_text, encoding='utf-8', newline='\n')

          changelog_path = root / 'CHANGELOG.md'
          changelog = changelog_path.read_text(encoding='utf-8-sig')
          hotfix_lines = '\n'.join([
              '- Fixed the launcher so an already-running Codex session without a local theme endpoint is never closed, force-terminated, or restarted automatically.',
              '- `LAUNCH-CODEX-THEMED.cmd` and `APPLY-THEME.cmd` now fail closed with exit code 2 and ask the user to finish active work and quit Codex manually.',
              '',
          ])
          marker = '### Fixed\n\n'
          if hotfix_lines not in changelog:
              if marker not in changelog:
                  raise RuntimeError('CHANGELOG Fixed section was not found.')
              changelog = changelog.replace(marker, marker + hotfix_lines, 1)
          changelog_path.write_text(changelog, encoding='utf-8', newline='\n')

          notes_path = root / 'docs' / 'RELEASE-NOTES-1.12.3.md'
          notes = notes_path.read_text(encoding='utf-8-sig')
          hotfix_section = '\n'.join([
              '## 安全热修复',
              '',
              '- 修复 Launcher 在检测到“Codex 已运行但没有本地主题端点”时，可能自动关闭或强制结束 Codex 进程的问题。',
              '- 现在 Launcher 只返回退出码 `2` 并提示手动退出，不会自动关闭、强制结束或重启 Codex，避免打断正在执行的任务。',
              '- `APPLY-THEME.cmd` 也不再自动进入恢复启动流程；请完成当前任务、从托盘完全退出 Codex，再运行 `LAUNCH-CODEX-THEMED.cmd`。',
              '',
              '',
          ])
          notes_marker = '## 本版重点\n'
          if hotfix_section not in notes:
              if notes_marker not in notes:
                  raise RuntimeError('Release-note insertion point was not found.')
              notes = notes.replace(notes_marker, hotfix_section + notes_marker, 1)
          notes_path.write_text(notes, encoding='utf-8', newline='\n')

          install_path = root / 'docs' / 'INSTALL.md'
          install = install_path.read_text(encoding='utf-8-sig')
          install_note = ('\n如果 Launcher 检测到 Codex 已经运行、但该进程没有本地主题端点，它只会提示并返回退出码 `2`；'
                          '不会关闭、强制结束或自动重启 Codex。请先完成正在执行的任务，再从托盘完全退出后重新运行 Launcher。\n')
          install_marker = '如果 Codex 已经以本地调试端口运行，也可以直接双击 `APPLY-THEME.cmd`；脚本会等待最多 5 秒发现可注入会话。\n'
          if install_note.strip() not in install:
              if install_marker not in install:
                  raise RuntimeError('INSTALL insertion point was not found.')
              install = install.replace(install_marker, install_marker + install_note, 1)
          install_path.write_text(install, encoding='utf-8', newline='\n')

          compatibility_path = root / 'docs' / 'COMPATIBILITY.md'
          compatibility = compatibility_path.read_text(encoding='utf-8-sig')
          compatibility_line = ('- 若检测到未带本地主题端点的运行中 Codex，Launcher 会安全退出并返回码 `2`，'
                                '不会关闭、强制结束或自动重启现有进程；\n')
          compatibility_marker = '- 更新后从主题入口完全重启，可在新版上恢复挂载。\n'
          if compatibility_line not in compatibility:
              if compatibility_marker not in compatibility:
                  raise RuntimeError('COMPATIBILITY insertion point was not found.')
              compatibility = compatibility.replace(compatibility_marker, compatibility_marker + compatibility_line, 1)
          compatibility_path.write_text(compatibility, encoding='utf-8', newline='\n')

          workflow_root = root / '.github'
          if workflow_root.exists():
              shutil.rmtree(workflow_root)

      - name: Regenerate hashes and build once
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\Build-Release.ps1 -SkipTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run package validation
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\Test-ThemePackage.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build the validated release package
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\Build-Release.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit the hotfix metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore .github
          git add -A
          git commit -m "Complete v1.12.3 safe-launcher hotfix"
          git push origin HEAD:main

      - name: Replace v1.12.3 assets and align the tag
        shell: bash
        run: |
          set -euo pipefail
          git tag -f v1.12.3 HEAD
          git push origin refs/tags/v1.12.3 --force
          gh release edit v1.12.3 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Codex Surface Theme v1.12.3" \
            --notes-file docs/RELEASE-NOTES-1.12.3.md \
            --latest
          gh release upload v1.12.3 \
            dist/codex-surface-theme-1.12.3.zip \
            dist/codex-surface-theme-1.12.3.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
