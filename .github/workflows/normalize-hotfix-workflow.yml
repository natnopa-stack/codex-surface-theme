name: Normalize hotfix workflow checkout

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/normalize-hotfix-workflow.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add LF-preserving checkout step
        shell: python
        run: |
          from pathlib import Path

          target = Path('.github/workflows/hotfix-v1.12.3-safe-launcher.yml')
          text = target.read_text(encoding='utf-8')
          needle = '''      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
'''
          replacement = '''      - name: Normalize checkout line endings
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git reset --hard HEAD

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
'''
          if needle not in text:
              raise RuntimeError('Hotfix workflow insertion point was not found.')
          target.write_text(text.replace(needle, replacement, 1), encoding='utf-8', newline='\n')

          helper = Path('.github/workflows/normalize-hotfix-workflow.yml')
          if helper.exists():
              helper.unlink()

      - name: Commit normalized workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize hotfix workflow checkout"
          git push origin HEAD:main
