name: Publish and clean v1.12.3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-and-clean-v1.12.3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-and-clean:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify release archive
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check codex-surface-theme-1.12.3.zip.sha256

      - name: Create or refresh GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.12.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v1.12.3 \
              --repo "$GITHUB_REPOSITORY" \
              --title "Codex Surface Theme v1.12.3" \
              --notes-file codex-surface-theme-1.12.3-release-notes.md \
              --latest
            gh release upload v1.12.3 \
              codex-surface-theme-1.12.3.zip \
              codex-surface-theme-1.12.3.zip.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create v1.12.3 \
              codex-surface-theme-1.12.3.zip \
              codex-surface-theme-1.12.3.zip.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --title "Codex Surface Theme v1.12.3" \
              --notes-file codex-surface-theme-1.12.3-release-notes.md \
              --latest
          fi

      - name: Remove duplicated release files and refresh public hashes
        shell: python
        run: |
          from __future__ import annotations

          import hashlib
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path(".")
          remove_paths = [
              Path("codex-surface-theme-1.12.3-release-notes.md"),
              Path("codex-surface-theme-1.12.3.zip"),
              Path("codex-surface-theme-1.12.3.zip.sha256"),
              Path("docs/CONTRIBUTING.md"),
              Path(".github/workflows/publish-and-clean-v1.12.3.yml"),
          ]
          for relative_path in remove_paths:
              path = root / relative_path
              if path.exists():
                  path.unlink()

          sums_path = root / "SHA256SUMS.txt"
          original = sums_path.read_text(encoding="utf-8-sig").splitlines()
          pattern = re.compile(r"^[0-9A-Fa-f]{64}  (.+)$")
          tracked_paths: list[str] = []
          for line in original:
              match = pattern.match(line)
              if not match:
                  continue
              relative = match.group(1).replace("\\", "/")
              if relative == "SHA256SUMS.txt":
                  continue
              if (root / relative).is_file():
                  tracked_paths.append(relative)

          today = datetime.now(timezone.utc).date().isoformat()
          output = [
              "# Codex Surface Theme 1.12.3 public file hashes",
              "# Format: SHA256  relative-path",
              f"# Generated {today}; excludes machine-specific files, runtime logs (*.log), and internal files.",
          ]
          for relative in tracked_paths:
              digest = hashlib.sha256((root / relative).read_bytes()).hexdigest().upper()
              output.append(f"{digest}  {relative}")

          sums_path.write_text("\r\n".join(output) + "\r\n", encoding="utf-8")

      - name: Commit clean repository layout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit."
            exit 0
          fi
          git commit -m "Publish v1.12.3 release and clean repository"
          git push
