name: Refresh project title

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/refresh-project-title.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Refresh README titles and hashes
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import re

          root = Path('.')

          readme = root / 'README.md'
          text = readme.read_text(encoding='utf-8-sig')
          old = '# Codex Surface Theme\n\n'
          new = '# Make Your Codex Feel Alive\n\n**Codex Surface Theme** — A KITT-inspired dark interface with reactive signals, live activity, and project customization.\n\n'
          if old not in text:
              raise RuntimeError('README title not found')
          readme.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          zh = root / 'README.zh-CN.md'
          text = zh.read_text(encoding='utf-8-sig')
          old = '# Codex Surface Theme（简体中文版）\n\n'
          new = '# 让你的 Codex 活起来\n\n**Codex Surface Theme** —— 一套受 KITT 启发、会随任务状态产生反馈的 Codex 暗色界面。\n\n'
          if old not in text:
              raise RuntimeError('Chinese README title not found')
          zh.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          sums = root / 'SHA256SUMS.txt'
          lines = sums.read_text(encoding='utf-8-sig').splitlines()
          replacements = {}
          for relative in ('README.md', 'README.zh-CN.md'):
              digest = hashlib.sha256((root / relative).read_bytes()).hexdigest().upper()
              replacements[relative] = f'{digest}  {relative}'

          output = []
          seen = set()
          for line in lines:
              match = re.match(r'^[0-9A-Fa-f]{64}  (.+)$', line)
              if match and match.group(1) in replacements:
                  relative = match.group(1)
                  output.append(replacements[relative])
                  seen.add(relative)
              else:
                  output.append(line)
          missing = set(replacements) - seen
          if missing:
              raise RuntimeError(f'Missing SHA entries: {sorted(missing)}')
          sums.write_text('\n'.join(output) + '\n', encoding='utf-8', newline='\n')

      - name: Update Release title
        shell: bash
        run: |
          set -euo pipefail
          gh release edit v1.12.3 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Make Your Codex Feel Alive — Codex Surface Theme v1.12.3"

      - name: Commit title refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh-CN.md SHA256SUMS.txt
          git commit -m "Refresh project presentation title"
          git push origin HEAD:main
